databaseChangeLog:
  - changeSet:
      id: 2024-07-09 09.00 Timofeev A. create table project_descriptions_dict
      author: Andrey Timofeev
      changes:
        - preConditions:
            - onFail: MARK_RAN
            - not:
                tableExists:
                  schemaName: management
                  tableName: project_descriptions
        - createTable:
            tableName: project_descriptions_dict
            schemaName: management
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_project_descriptions_dict
                    nullable: false
              - column:
                  name: employee_id
                  remarks: сотрудник
                  type: bigint
              - column:
                  name: description
                  remarks: описание проекта
                  type: text
        - addForeignKeyConstraint:
            baseColumnNames: employee_id
            baseTableName: project_descriptions_dict
            baseTableSchemaName: management
            constraintName: fk_project_descriptions_employee
            deferrable: true
            initiallyDeferred: true
            referencedColumnNames: id
            referencedTableName: employees
            referencedTableSchemaName: management
            validate: true
