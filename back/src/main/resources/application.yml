management:
  metrics:
    export.prometheus.enabled: true
    tags:
      application: ${spring.application.name}
      name: ${spring.application.name}
      port: ${server.port}
      destination: ""
  endpoints:
    web:
      exposure.include: '*'
  endpoint:
    health:
      show-details: always
      show-components: always

server:
  port: ${APP_PORT:8084}
  servlet:
    context-path: /api
    
spring:
  application:
    name: management-service
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://db:5432/postgres}?ApplicationName=${HOSTNAME}
    username: ${JDBC_USER:andreytimofeev}
    password: ${JDBC_PASSWORD:dunice}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    generate-ddl: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 100
        cache:
          use_second_level_cache: false
          region:
            factory_class: org.hibernate.cache.ehcache.EhCacheRegionFactory
        default_batch_fetch_size: 100