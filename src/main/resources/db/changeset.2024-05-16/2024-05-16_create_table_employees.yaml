databaseChangeLog:
  - changeSet:
      id: 2024-05-16 09.00 Timofeev A. create table employees
      author: Andrey Timofeev
      changes:
        - preConditions:
            - onFail: MARK_RAN
            - not:
                tableExists:
                  schemaName: management
                  tableName: employees
        - createTable:
            tableName: employees
            schemaName: management
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_employees
                    nullable: false
              - column:
                  name: first_name
                  remarks: Имя
                  type: text
              - column:
                  name: last_name
                  remarks: Фамилия
                  type: text
              - column:
                  name: patronymic
                  remarks: Отчество
                  type: text
              - column:
                  name: incoming_date
                  remarks: Дата перевода в отдел
                  type: date
              - column:
                  name: birth_date
                  remarks: Дата рождения
                  type: date
              - column:
                  name: english
                  remarks: Уровень английского
                  type: text
              - column:
                  name: education
                  remarks: Образование
                  type: text
              - column:
                  name: personal_email
                  remarks: Личная почта
                  type: text
              - column:
                  name: corp_email
                  remarks: Корпоративная почта
                  type: text
              - column:
                  name: phone
                  remarks: Номер телефона
                  type: text
              - column:
                  name: tg
                  remarks: Телеграм
                  type: text
              - column:
                  name: is_fired
                  remarks: Уволен
                  type: boolean

