databaseChangeLog:
  - changeSet:
      id: 2024-07-09 09.00 Timofeev A. create table placement
      author: Andrey Timofeev
      changes:
        - preConditions:
            - onFail: MARK_RAN
            - not:
                tableExists:
                  schemaName: management
                  tableName: placement
        - createTable:
            tableName: placement
            schemaName: management
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_placement
                    nullable: false
              - column:
                  name: raw
                  remarks: ряд
                  type: int
              - column:
                  name: place
                  remarks: место
                  type: int
              - column:
                  name: employee_id
                  remarks: разработчик
                  type: bigint
        - addForeignKeyConstraint:
            baseColumnNames: employee_id
            baseTableName: placement
            baseTableSchemaName: management
            constraintName: fk_placement
            deferrable: true
            initiallyDeferred: true
            referencedColumnNames: id
            referencedTableName: employees
            referencedTableSchemaName: management
            validate: true
