databaseChangeLog:
  - changeSet:
      id: 2024-07-09 09.00 Timofeev A. create table projects
      author: Andrey Timofeev
      changes:
        - preConditions:
            - onFail: MARK_RAN
            - not:
                tableExists:
                  schemaName: management
                  tableName: projects
        - createTable:
            tableName: projects
            schemaName: management
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_projects
                    nullable: false
              - column:
                  name: project_id
                  remarks: проект
                  type: bigint
              - column:
                  name: employee_id
                  remarks: сотрудник
                  type: bigint
              - column:
                  name: start_date
                  remarks: дата старта
                  type: date
              - column:
                  name: end_date
                  remarks: дата окончания
                  type: date
        - addForeignKeyConstraint:
            baseColumnNames: project_id
            baseTableName: projects
            baseTableSchemaName: management
            constraintName: fk_projects_type
            deferrable: true
            initiallyDeferred: true
            referencedColumnNames: id
            referencedTableName: projects_dict
            referencedTableSchemaName: management
            validate: true
        - addForeignKeyConstraint:
            baseColumnNames: employee_id
            baseTableName: projects
            baseTableSchemaName: management
            constraintName: fk_projects_employee
            deferrable: true
            initiallyDeferred: true
            onDelete: CASCADE
            onUpdate: RESTRICT
            referencedColumnNames: id
            referencedTableName: employees
            referencedTableSchemaName: management
            validate: true
