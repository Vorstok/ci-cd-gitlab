databaseChangeLog:
  - changeSet:
      id: 2024-07-09 09.00 Timofeev A. create table vacations
      author: Andrey Timofeev
      changes:
        - preConditions:
            - onFail: MARK_RAN
            - not:
                tableExists:
                  schemaName: management
                  tableName: vacations
        - createTable:
            tableName: vacations
            schemaName: management
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_vacations
                    nullable: false
              - column:
                  name: employee_id
                  remarks: разработчик
                  type: bigint
              - column:
                  name: start_date
                  remarks: дата
                  type: date
              - column:
                  name: days
                  remarks: количество дней
                  type: int
        - addForeignKeyConstraint:
            baseColumnNames: employee_id
            baseTableName: vacations
            baseTableSchemaName: management
            constraintName: fk_vacations_employee
            deferrable: true
            initiallyDeferred: true
            referencedColumnNames: id
            referencedTableName: employees
            referencedTableSchemaName: management
            validate: true
