databaseChangeLog:
  - changeSet:
      id: 2024-07-10 09.00 Timofeev A. create table rooms
      author: Andrey Timofeev
      changes:
        - preConditions:
            - onFail: MARK_RAN
            - not:
                tableExists:
                  schemaName: management
                  tableName: rooms
        - createTable:
            tableName: rooms
            schemaName: management
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_rooms
                    nullable: false
              - column:
                  name: room_name
                  remarks: название
                  type: text
              - column:
                  name: office
                  remarks: офис
                  type: text