stages:
  - test
  - build

test:front:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm test -- --watchAll=false --passWithNoTests --reporters=default --reporters=jest-junit
  artifacts:
    when: always
    paths:
      - junit.xml

build:front:
  stage: build
  image: docker:27
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t "$CI_REGISTRY_IMAGE/front:latest" .
    - docker push "$CI_REGISTRY_IMAGE/front:latest"